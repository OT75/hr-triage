<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>Observability: four views of the system</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#59636e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="40" width="200" height="340" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="140.0" y="193.0" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle" dominant-baseline="central">backend</text><text x="140.0" y="211.0" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">every request</text><text x="140.0" y="228.0" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">gets a request ID</text><rect x="300" y="40" width="260" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="430.0" y="58.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">JSON logs</text><text x="430.0" y="76.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">request ID, step, latency, tokens</text><text x="430.0" y="93.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">no names or request text</text><rect x="620" y="40" width="300" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="770.0" y="66.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">docker compose logs</text><text x="770.0" y="84.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">What happened to this request?</text><path d="M240 75 L298 75" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M560 75 L618 75" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><rect x="300" y="130" width="260" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="430.0" y="148.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">/metrics</text><text x="430.0" y="166.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">latency histograms, tokens,</text><text x="430.0" y="183.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">errors, tickets per category</text><rect x="620" y="130" width="300" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="770.0" y="156.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Prometheus → Grafana</text><text x="770.0" y="174.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">Is the system healthy over time?</text><path d="M240 165 L298 165" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M560 165 L618 165" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><rect x="300" y="220" width="260" height="70" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="430.0" y="238.0" font-size="14" font-weight="600" fill="#6639ba" text-anchor="middle" dominant-baseline="central">Traces (@observe)</text><text x="430.0" y="256.0" font-size="12.5" font-weight="400" fill="#8250df" text-anchor="middle" dominant-baseline="central">one trace per request,</text><text x="430.0" y="273.0" font-size="12.5" font-weight="400" fill="#8250df" text-anchor="middle" dominant-baseline="central">extract + draft as steps</text><rect x="620" y="220" width="300" height="70" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="770.0" y="246.5" font-size="14" font-weight="600" fill="#6639ba" text-anchor="middle" dominant-baseline="central">Langfuse</text><text x="770.0" y="264.5" font-size="12.5" font-weight="400" fill="#8250df" text-anchor="middle" dominant-baseline="central">What did the model see and say?</text><path d="M240 255 L298 255" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M560 255 L618 255" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><rect x="300" y="310" width="260" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="430.0" y="336.5" font-size="14" font-weight="600" fill="#116329" text-anchor="middle" dominant-baseline="central">tickets table</text><text x="430.0" y="354.5" font-size="12.5" font-weight="400" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">review flag, edited flag</text><rect x="620" y="310" width="300" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="770.0" y="336.5" font-size="14" font-weight="600" fill="#116329" text-anchor="middle" dominant-baseline="central">GET /stats → HR dashboard</text><text x="770.0" y="354.5" font-size="12.5" font-weight="400" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">Is the AI actually useful?</text><path d="M240 345 L298 345" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M560 345 L618 345" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><text x="40" y="404" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">A metric shows that something is wrong, the logs show which requests, the trace shows what the model did.</text></svg>