<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>Continuous integration</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#59636e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="100" width="180" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="130.0" y="119.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">git push</text><text x="130.0" y="137.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">or pull request</text><rect x="300" y="40" width="330" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="465.0" y="59.5" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle" dominant-baseline="central">backend-tests</text><text x="465.0" y="77.5" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">pytest: schemas + routing rules</text><path d="M220 128 L260 128 L260 68 L298 68" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M630 68 L665 68 L665 128 L698 128" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><rect x="300" y="110" width="330" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="465.0" y="129.5" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle" dominant-baseline="central">frontend-build</text><text x="465.0" y="147.5" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">tsc type check + vite build</text><path d="M220 128 L260 128 L260 138 L298 138" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M630 138 L665 138 L665 128 L698 128" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><rect x="300" y="180" width="330" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="465.0" y="199.5" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle" dominant-baseline="central">docker-images</text><text x="465.0" y="217.5" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">docker build backend + frontend</text><path d="M220 128 L260 128 L260 208 L298 208" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M630 208 L665 208 L665 128 L698 128" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><rect x="700" y="100" width="170" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="785.0" y="119.5" font-size="14" font-weight="600" fill="#116329" text-anchor="middle" dominant-baseline="central">All green</text><text x="785.0" y="137.5" font-size="12.5" font-weight="400" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">safe to merge</text><text x="40" y="254" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">Each job runs on a fresh machine, in parallel. No real secrets: the tests never call the LLM or the database.</text></svg>