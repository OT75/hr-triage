<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>Request pipeline with human in the loop</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#9198a1"/></marker></defs><rect width="100%" height="100%" fill="#0d1117"/><rect x="200" y="40" width="320" height="50" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="360.0" y="65.0" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">Employee submits a request</text><rect x="200" y="120" width="320" height="60" rx="8" fill="#0d2b45" stroke="#1f6feb" stroke-width="1"/><text x="360.0" y="141.5" font-size="14" font-weight="600" fill="#79c0ff" text-anchor="middle" dominant-baseline="central">1 · Validate input</text><text x="360.0" y="159.5" font-size="12.5" font-weight="400" fill="#58a6ff" text-anchor="middle" dominant-baseline="central">Pydantic: valid email, 5–5000 characters</text><rect x="200" y="210" width="320" height="60" rx="8" fill="#2a1b45" stroke="#8957e5" stroke-width="1"/><text x="360.0" y="231.5" font-size="14" font-weight="600" fill="#d2a8ff" text-anchor="middle" dominant-baseline="central">2 · Extract (LLM, nano)</text><text x="360.0" y="249.5" font-size="12.5" font-weight="400" fill="#bc8cff" text-anchor="middle" dominant-baseline="central">category, urgency, language, summary, topics</text><rect x="200" y="300" width="320" height="60" rx="8" fill="#2a1b45" stroke="#8957e5" stroke-width="1"/><text x="360.0" y="321.5" font-size="14" font-weight="600" fill="#d2a8ff" text-anchor="middle" dominant-baseline="central">3 · Draft reply (LLM, mini)</text><text x="360.0" y="339.5" font-size="12.5" font-weight="400" fill="#bc8cff" text-anchor="middle" dominant-baseline="central">only from the category's policy text</text><rect x="200" y="390" width="320" height="60" rx="8" fill="#0d2b45" stroke="#1f6feb" stroke-width="1"/><text x="360.0" y="411.5" font-size="14" font-weight="600" fill="#79c0ff" text-anchor="middle" dominant-baseline="central">4 · Route (plain Python)</text><text x="360.0" y="429.5" font-size="12.5" font-weight="400" fill="#58a6ff" text-anchor="middle" dominant-baseline="central">queue + review flag + reasons</text><rect x="200" y="480" width="320" height="60" rx="8" fill="#0f2d1a" stroke="#238636" stroke-width="1"/><text x="360.0" y="501.5" font-size="14" font-weight="600" fill="#7ee787" text-anchor="middle" dominant-baseline="central">5 · Save ticket (PostgreSQL)</text><text x="360.0" y="519.5" font-size="12.5" font-weight="400" fill="#56d364" text-anchor="middle" dominant-baseline="central">the employee only gets a receipt</text><rect x="200" y="570" width="320" height="60" rx="8" fill="#2e2410" stroke="#9e6a03" stroke-width="1"/><text x="360.0" y="591.5" font-size="14" font-weight="600" fill="#e3b341" text-anchor="middle" dominant-baseline="central">6 · HR reviews, edits, approves</text><text x="360.0" y="609.5" font-size="12.5" font-weight="400" fill="#d29922" text-anchor="middle" dominant-baseline="central">review tickets are shown first</text><rect x="200" y="660" width="320" height="60" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/><text x="360.0" y="681.5" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">Approved reply to the employee</text><text x="360.0" y="699.5" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle" dominant-baseline="central">sending by email: next step</text><path d="M360 90 L360 118" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/><path d="M360 180 L360 208" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/><path d="M360 270 L360 298" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/><path d="M360 360 L360 388" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/><path d="M360 450 L360 478" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/><path d="M360 540 L360 568" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/><path d="M360 630 L360 658" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/><rect x="580" y="210" width="340" height="60" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1" stroke-dasharray="5 4"/><text x="750.0" y="231.5" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">Invalid output → retry once with the error</text><text x="750.0" y="249.5" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle" dominant-baseline="central">fails again → no extraction → review</text><rect x="580" y="300" width="340" height="60" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1" stroke-dasharray="5 4"/><text x="750.0" y="321.5" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">No category, or no policy file</text><text x="750.0" y="339.5" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle" dominant-baseline="central">fixed holding reply, no LLM call</text><rect x="580" y="390" width="340" height="170" rx="8" fill="#2e2410" stroke="#9e6a03" stroke-width="1"/><text x="596" y="414" font-size="14" font-weight="600" fill="#e3b341" text-anchor="start" dominant-baseline="central">Needs human review if…</text><text x="596" y="442" font-size="12.5" font-weight="400" fill="#d29922" text-anchor="start" dominant-baseline="central">•  extraction failed</text><text x="596" y="464" font-size="12.5" font-weight="400" fill="#d29922" text-anchor="start" dominant-baseline="central">•  no clear HR category (other)</text><text x="596" y="486" font-size="12.5" font-weight="400" fill="#d29922" text-anchor="start" dominant-baseline="central">•  urgency is high</text><text x="596" y="508" font-size="12.5" font-weight="400" fill="#d29922" text-anchor="start" dominant-baseline="central">•  it also asks about other topics</text><text x="596" y="530" font-size="12.5" font-weight="400" fill="#d29922" text-anchor="start" dominant-baseline="central">•  the draft couldn't answer everything</text><path d="M520 240 L578 240" fill="none" stroke="#9198a1" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M520 330 L578 330" fill="none" stroke="#9198a1" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M520 420 L578 420" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/><path d="M750 560 L750 600 L522 600" fill="none" stroke="#9198a1" stroke-width="1.3" marker-end="url(#a)"/><rect x="30" y="210" width="140" height="150" rx="12" fill="#2a1b45" stroke="#8957e5" stroke-width="1"/><text x="100.0" y="268.0" font-size="14" font-weight="600" fill="#d2a8ff" text-anchor="middle" dominant-baseline="central">AI suggests</text><text x="100.0" y="286.0" font-size="12.5" font-weight="400" fill="#bc8cff" text-anchor="middle" dominant-baseline="central">extracts</text><text x="100.0" y="303.0" font-size="12.5" font-weight="400" fill="#bc8cff" text-anchor="middle" dominant-baseline="central">and drafts</text><rect x="30" y="390" width="140" height="60" rx="12" fill="#0d2b45" stroke="#1f6feb" stroke-width="1"/><text x="100.0" y="411.5" font-size="14" font-weight="600" fill="#79c0ff" text-anchor="middle" dominant-baseline="central">Code decides</text><text x="100.0" y="429.5" font-size="12.5" font-weight="400" fill="#58a6ff" text-anchor="middle" dominant-baseline="central">testable rules</text><rect x="30" y="570" width="140" height="60" rx="12" fill="#2e2410" stroke="#9e6a03" stroke-width="1"/><text x="100.0" y="591.5" font-size="14" font-weight="600" fill="#e3b341" text-anchor="middle" dominant-baseline="central">Human approves</text><text x="100.0" y="609.5" font-size="12.5" font-weight="400" fill="#d29922" text-anchor="middle" dominant-baseline="central">nothing sent alone</text></svg>