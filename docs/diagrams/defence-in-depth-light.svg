<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>Defence in depth</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#59636e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="40" y="30" width="820" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="450.0" y="52.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Untrusted: the employee's text, and everything the LLM returns</text><rect x="40" y="92" width="820" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="60" y="118" font-size="14" font-weight="600" fill="#0550ae" text-anchor="start" dominant-baseline="central">Input validation (Pydantic)</text><text x="340" y="118" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="start" dominant-baseline="central">Stops: malformed input, invalid email, empty or huge text → 422</text><rect x="40" y="154" width="820" height="52" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="60" y="180" font-size="14" font-weight="600" fill="#6639ba" text-anchor="start" dominant-baseline="central">Prompt rule: the request is data</text><text x="340" y="180" font-size="12.5" font-weight="400" fill="#8250df" text-anchor="start" dominant-baseline="central">Stops: most prompt injection ("ignore your instructions and…")</text><rect x="40" y="216" width="820" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="60" y="242" font-size="14" font-weight="600" fill="#0550ae" text-anchor="start" dominant-baseline="central">Structured output + schema</text><text x="340" y="242" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="start" dominant-baseline="central">Stops: invented categories, missing fields, out-of-range values</text><rect x="40" y="278" width="820" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="60" y="304" font-size="14" font-weight="600" fill="#0550ae" text-anchor="start" dominant-baseline="central">Retry with the error, then fallback</text><text x="340" y="304" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="start" dominant-baseline="central">Stops: a bad LLM answer never crashes a request</text><rect x="40" y="340" width="820" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="60" y="366" font-size="14" font-weight="600" fill="#0550ae" text-anchor="start" dominant-baseline="central">Grounded drafting</text><text x="340" y="366" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="start" dominant-baseline="central">Stops: invented policy facts: drafts use only the policy text</text><rect x="40" y="402" width="820" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="60" y="428" font-size="14" font-weight="600" fill="#0550ae" text-anchor="start" dominant-baseline="central">Routing rules in Python</text><text x="340" y="428" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="start" dominant-baseline="central">Stops: the LLM deciding where a ticket goes</text><rect x="40" y="464" width="820" height="52" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/><text x="60" y="490" font-size="14" font-weight="600" fill="#7d4e00" text-anchor="start" dominant-baseline="central">Review flags with reasons</text><text x="340" y="490" font-size="12.5" font-weight="400" fill="#9a6700" text-anchor="start" dominant-baseline="central">Stops: unclear, urgent, mixed or unanswered requests slipping by</text><rect x="40" y="526" width="820" height="52" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/><text x="60" y="552" font-size="14" font-weight="600" fill="#7d4e00" text-anchor="start" dominant-baseline="central">HR approval</text><text x="340" y="552" font-size="12.5" font-weight="400" fill="#9a6700" text-anchor="start" dominant-baseline="central">Stops: anything reaching an employee without a human</text><text x="40" y="602" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">Each layer assumes the one before it can fail. Blue: code checks   ·   Purple: prompt   ·   Yellow: humans</text></svg>