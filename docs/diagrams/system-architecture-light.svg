<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="610" viewBox="0 0 1130 610" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>HR Triage system architecture</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#59636e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="30" y="100" width="160" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="110.0" y="119.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Employee</text><text x="110.0" y="137.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">submits requests</text><rect x="30" y="190" width="160" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="110.0" y="209.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">HR staff</text><text x="110.0" y="227.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">reviews and approves</text><rect x="30" y="470" width="160" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="110.0" y="489.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Engineer</text><text x="110.0" y="507.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">watches the system</text><rect x="240" y="130" width="190" height="86" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="335.0" y="156.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Browser</text><text x="335.0" y="174.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">React + TypeScript app</text><text x="335.0" y="191.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">runs on the user's machine</text><rect x="480" y="50" width="400" height="510" rx="14" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="6 5"/><text x="498" y="70" font-size="12.5" font-weight="600" fill="#59636e" text-anchor="start" dominant-baseline="central">Docker Compose · one command</text><rect x="510" y="95" width="340" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="680.0" y="114.5" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle" dominant-baseline="central">frontend · nginx</text><text x="680.0" y="132.5" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">serves the built React files</text><rect x="510" y="185" width="340" height="110" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/><text x="680.0" y="223.0" font-size="14" font-weight="600" fill="#0550ae" text-anchor="middle" dominant-baseline="central">backend · FastAPI</text><text x="680.0" y="241.0" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">validate → extract → draft → route → save</text><text x="680.0" y="258.0" font-size="12.5" font-weight="400" fill="#0969da" text-anchor="middle" dominant-baseline="central">HR API with login · JSON logs · /metrics</text><rect x="510" y="345" width="160" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/><text x="590.0" y="363.0" font-size="14" font-weight="600" fill="#116329" text-anchor="middle" dominant-baseline="central">db · PostgreSQL</text><text x="590.0" y="381.0" font-size="12.5" font-weight="400" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">tickets</text><text x="590.0" y="398.0" font-size="12.5" font-weight="400" fill="#1a7f37" text-anchor="middle" dominant-baseline="central">data in a volume</text><rect x="690" y="345" width="160" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="770.0" y="363.0" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Prometheus</text><text x="770.0" y="381.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">scrapes /metrics</text><text x="770.0" y="398.0" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">every 5 s</text><rect x="690" y="455" width="160" height="70" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="770.0" y="481.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Grafana</text><text x="770.0" y="499.5" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="middle" dominant-baseline="central">dashboards</text><rect x="930" y="175" width="180" height="70" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="1020.0" y="193.0" font-size="14" font-weight="600" fill="#6639ba" text-anchor="middle" dominant-baseline="central">OpenAI API</text><text x="1020.0" y="211.0" font-size="12.5" font-weight="400" fill="#8250df" text-anchor="middle" dominant-baseline="central">nano: extraction</text><text x="1020.0" y="228.0" font-size="12.5" font-weight="400" fill="#8250df" text-anchor="middle" dominant-baseline="central">mini: drafting</text><rect x="930" y="275" width="180" height="56" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1"/><text x="1020.0" y="294.5" font-size="14" font-weight="600" fill="#6639ba" text-anchor="middle" dominant-baseline="central">Langfuse</text><text x="1020.0" y="312.5" font-size="12.5" font-weight="400" fill="#8250df" text-anchor="middle" dominant-baseline="central">LLM traces</text><path d="M190 128 L215 128 L215 160 L238 160" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M190 218 L215 218 L215 190 L238 190" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M430 150 L455 150 L455 123 L508 123" fill="none" stroke="#59636e" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M430 195 L455 195 L455 240 L508 240" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M590 295 L590 343" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M770 345 L770 297" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M770 455 L770 417" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M190 498 L688 498" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M850 215 L928 215" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><path d="M850 275 L890 275 L890 303 L928 303" fill="none" stroke="#59636e" stroke-width="1.3" marker-end="url(#a)"/><text x="30" y="588" font-size="12" font-weight="400" fill="#59636e" text-anchor="start" dominant-baseline="central">Blue: our code   ·   Purple: LLM services   ·   Green: data   ·   Dashed arrow: the browser loads the app once, then calls the API directly</text></svg>